# WM8960 belongs to CarPlay's ALSA dmix, not the desktop audio manager.
# WirePlumber's speaker route otherwise sets Headphone to zero at login.
# Install: ~/.config/wireplumber/wireplumber.conf.d/51-carplay-wm8960.conf
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-soc_sound" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
